<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ title }} - ArchAuditor</title>
    <script src="https://gw.alipayobjects.com/os/lib/antv/g6/4.8.24/dist/g6.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            line-height: 1.5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 700;
            color: #1e293b;
        }

        .back-link {
            background: var(--bg-card);
            color: var(--primary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
            transition: all 0.2s;
            display: inline-block;
        }

        .back-link:hover {
            background: #eff6ff;
            border-color: #bfdbfe;
        }

        .description {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px 20px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
            color: var(--text-muted);
        }

        .graph-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            border: 1px solid var(--border);
        }

        #graph-container {
            width: 100%;
            height: 600px;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: #fafbfc;
        }

        .legend {
            margin-top: 16px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 6px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            font-size: 0.9rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-icon {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .tooltip {
            position: absolute;
            display: none;
            pointer-events: none;
            z-index: 10;
            max-width: 280px;
            border-radius: 6px;
            background: rgba(15, 23, 42, 0.92);
            color: #ffffff;
            padding: 8px 10px;
            font-size: 12px;
            line-height: 1.45;
            box-shadow: 0 10px 20px rgb(15 23 42 / 0.2);
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>{{ title }}</h1>
            <a href="/" class="back-link">← 返回控制面板</a>
        </header>

        {% if description %}
        <div class="description">
            {{ description }}
        </div>
        {% endif %}

        <div class="graph-card">
            <div id="graph-container"></div>
            {% if legend %}
            <div class="legend">
                {% for item in legend %}
                <div class="legend-item">
                    <span class="legend-icon" style="background-color: {{ item.color }}"></span>
                    <span>{{ item.label }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}
        </div>
    </div>
    <div class="tooltip" id="tooltip"></div>

    <script>
        const graphData = {{ graph_data | safe }};

        // Configure the graph
        const container = document.getElementById('graph-container');
        const width = container.scrollWidth;
        const height = container.scrollHeight || 600;

        const graph = new G6.Graph({
            container: 'graph-container',
            width,
            height,
            layout: {
                type: 'gForce',
                preventOverlap: true,
                nodeSpacing: 60,
                linkDistance: 180,
                nodeStrength: 500,
                edgeStrength: 400,
                gravity: 10,
                gravityCenter: [width / 2, 100],
                clustering: true,
                clusterNodeStrength: -30,
                clusterEdgeStrength: 0.3,
                clusterFociStrength: 1.2,
                minMovement: 0.5,
                maxIteration: 1000,
            },
            defaultNode: {
                type: 'circle',
                size: 60,
                style: {
                    fill: '#5B8FF9',
                    stroke: '#ffffff',
                    lineWidth: 2,
                },
                labelCfg: {
                    style: {
                        fill: '#0f172a',
                        fontSize: 12,
                        fontWeight: 500,
                    },
                    position: 'bottom',
                    offset: 10,
                },
            },
            defaultEdge: {
                type: 'quadratic',
                style: {
                    endArrow: {
                        path: G6.Arrow.triangle(10, 12, 0),
                        d: 0,
                        fill: '#94a3b8',
                    },
                    stroke: '#94a3b8',
                    lineWidth: 2,
                    lineAppendWidth: 10,
                    opacity: 0.7,
                    offset: 20,
                },
                labelCfg: {
                    autoRotate: true,
                    style: {
                        fill: '#64748b',
                        fontSize: 10,
                        background: {
                            fill: '#ffffff',
                            padding: [2, 4, 2, 4],
                            radius: 4,
                        },
                    },
                },
            },
            modes: {
                default: ['drag-canvas', 'zoom-canvas', 'drag-node'],
            },
            fitView: true,
            fitViewPadding: [40, 40, 40, 40],
        });

        graph.data(graphData);
        graph.render();

        // Add resize listener
        window.addEventListener('resize', () => {
            const container = document.getElementById('graph-container');
            if (!graph || graph.get('destroyed')) return;
            if (!container || !container.scrollWidth || !container.scrollHeight) return;
            graph.changeSize(container.scrollWidth, container.scrollHeight);
            graph.fitView();
        });

        // Node click event
        graph.on('node:click', (evt) => {
            const { item } = evt;
            const model = item.getModel();
            console.log('Node clicked:', model);
        });

        const tooltip = document.getElementById('tooltip');
        graph.on('node:mouseenter', (evt) => {
            const model = evt.item.getModel();
            const status = model.trace_status === 'no_recent_trace'
                ? '无近期调用边'
                : '有近期调用数据';
            tooltip.innerHTML = `
                <div><strong>${model.id}</strong></div>
                <div>${status}</div>
                ${model.description ? `<div>${model.description}</div>` : ''}
            `;
            tooltip.style.display = 'block';
        });
        graph.on('node:mousemove', (evt) => {
            tooltip.style.left = `${evt.clientX + 12}px`;
            tooltip.style.top = `${evt.clientY + 12}px`;
        });
        graph.on('node:mouseleave', () => {
            tooltip.style.display = 'none';
        });
    </script>
</body>

</html>
