processors:
  ServicePrioritySource:
    type: InMemory
  ServiceGraphSource:
    type: Jaeger
    jaeger_url: http://localhost:16686/jaeger/ui
  PrometheusMetricsSource:
    type: Prometheus
    prometheus_url: http://localhost:9090
  CircularDependencyAnalyzer: {}
  DependencyCorrelationAnalyzer: {}
  ServiceDependencySource:
    type: Jaeger
    jaeger_url: http://localhost:16686/jaeger/ui
    lookback_ms: 3600000
    strong_call_threshold: 100
    correlation_threshold: 0.7
    min_aligned_points: 3
  K8sConfigSource:
    namespaces:
      - default
      - kube-system
  K8sConfigAnalyzer:
    namespaces:
      - default
      - kube-system
  SinglePointAnalyzer: {}
  MonolithicServiceAnalyzer:
    degree_threshold: 15
    resource_multiplier: 5.0
  ResourceUtilizationAnalyzer:
    waste_threshold: 0.3
    limit_risk_threshold: 0.7
